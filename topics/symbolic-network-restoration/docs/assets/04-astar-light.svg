<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 770" width="1120" height="770" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>A* search: f = g + h, admissibility, and strategy comparison</title>
  <desc>On the left, the cheapest route A* finds in the dual-homed scenario, beside the shorter route that costs more. On the right, the heuristic, its admissibility and consistency proofs, and the comparison table for five search strategies.</desc>
  <rect width="1120" height="770" fill="#fbfaf7"/>
  <text x="40" y="46" font-size="23" fill="#1f2933" font-weight="600">A* search - f(n) = g(n) + h(n)</text>
  <text x="40" y="72" font-size="14" fill="#52606d">g is the cost already paid; h estimates what remains. g alone is uniform cost (optimal, blind). h alone is greedy (fast, no guarantee).</text>
  <text x="40" y="112" font-size="15" fill="#1f2933" font-weight="700">Cheapest route in the dual-homed scenario: NOC to ER_03</text>
  <rect x="40" y="126" width="530" height="396" rx="10" fill="#ffffff" stroke="#c9c2b8" stroke-width="1.0"/>
  <polyline points="78,255 150,330 290,358 430,330" fill="none" stroke="#d4a373" stroke-width="3" stroke-linejoin="round" stroke-dasharray="4 4"/>
  <polyline points="78,255 150,175 268,150 388,182 496,245" fill="none" stroke="#D55E00" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" opacity="0.9"/>
  <rect x="66" y="243" width="24" height="24" rx="4" fill="#1b3a6b"/>
  <text x="52" y="288" font-size="11" fill="#1f2933" font-weight="700">NOC</text>
  <polygon points="150,163 160,180 140,180" fill="#3f7cac"/>
  <text x="120" y="156" font-size="10.5" fill="#1f2933" font-weight="700">eNB_A</text>
  <polygon points="268,138 277,155 259,155" fill="#3f7cac"/>
  <text x="242" y="132" font-size="10.5" fill="#1f2933">RELAY_1</text>
  <polygon points="388,170 397,187 379,187" fill="#3f7cac"/>
  <text x="362" y="164" font-size="10.5" fill="#1f2933">RELAY_5</text>
  <circle cx="496" cy="245" r="9" fill="#c1666b"/>
  <text x="466" y="232" font-size="10.5" fill="#1f2933">CPE_03</text>
  <rect x="141" y="321" width="18" height="18" rx="3" fill="#d4a373" transform="rotate(45 150 330)"/>
  <text x="120" y="358" font-size="10.5" fill="#1f2933">SAF_01</text>
  <rect x="281" y="349" width="18" height="18" rx="3" fill="#d4a373" transform="rotate(45 290 358)"/>
  <text x="262" y="386" font-size="10.5" fill="#1f2933">SAF_02</text>
  <circle cx="430" cy="330" r="9" fill="#6b8f71"/>
  <text x="404" y="358" font-size="10.5" fill="#1f2933">RM_03</text>
  <line x1="496" y1="245" x2="536" y2="282" stroke="#c9c2b8" stroke-width="1.6"/>
  <line x1="430" y1="330" x2="536" y2="294" stroke="#c9c2b8" stroke-width="1.6"/>
  <polygon points="544,272 554,288 534,288" fill="#b23a48"/>
  <polygon points="544,304 554,288 534,288" fill="#b23a48"/>
  <text x="508" y="326" font-size="11.5" fill="#1f2933" font-weight="700">ER_03</text>
  <text x="88" y="212" font-size="10.5" fill="#a8442a" font-weight="600">60.00</text>
  <text x="192" y="150" font-size="10.5" fill="#a8442a" font-weight="600">128.73</text>
  <text x="318" y="152" font-size="10.5" fill="#a8442a" font-weight="600">86.33</text>
  <text x="444" y="200" font-size="10.5" fill="#a8442a" font-weight="600">76.65</text>
  <text x="86" y="302" font-size="10.5" fill="#52606d" font-weight="600">28.31</text>
  <text x="190" y="352" font-size="10.5" fill="#52606d" font-weight="600">214.70</text>
  <text x="344" y="352" font-size="10.5" fill="#52606d" font-weight="600">201.85</text>
  <rect x="58" y="392" width="494" height="122" rx="6" fill="#fdecea" stroke="#D55E00" stroke-width="1.0"/>
  <text x="72" y="414" font-size="11" fill="#a8442a" font-weight="700">A*:  NOC -&gt; eNB_A -&gt; RELAY_1 -&gt; RELAY_5 -&gt; CPE_03 -&gt; ER_03</text>
  <text x="72" y="434" font-size="13" fill="#a8442a" font-weight="700">5 hops,  total cost = 360.35 ms    (private LTE)</text>
  <text x="72" y="460" font-size="11" fill="#52606d">breadth-first (dashed):  NOC -&gt; SAF_01 -&gt; SAF_02 -&gt; RM_03 -&gt; ER_03</text>
  <text x="72" y="478" font-size="11" fill="#52606d" font-weight="600">4 hops, 453.51 ms    (900 MHz store-and-forward)</text>
  <text x="72" y="502" font-size="11" fill="#a8442a" font-weight="700">FEWER hops, and 26% dearer: the medium decides, not the hop count.</text>
  <rect x="596" y="126" width="484" height="150" rx="10" fill="#ffffff" stroke="#E69F00" stroke-width="2"/>
  <text x="614" y="150" font-size="14" fill="#8a6100" font-weight="700">THE HEURISTIC</text>
  <text x="614" y="180" font-size="13" fill="#1f2933" font-family="Consolas, SFMono-Regular, Menlo, monospace">h(n) =</text>
  <text x="676" y="174" font-size="12.5" fill="#1f2933" font-family="Consolas, SFMono-Regular, Menlo, monospace">straight_line_distance(n, goal)</text>
  <line x1="672" y1="182" x2="936" y2="182" stroke="#1f2933" stroke-width="1.2"/>
  <text x="742" y="200" font-size="12.5" fill="#1f2933" font-family="Consolas, SFMono-Regular, Menlo, monospace">MAX_SPEED</text>
  <text x="614" y="232" font-size="11.5" fill="#52606d">MAX_SPEED = 150 m/ms - the fastest effective speed in the</text>
  <text x="614" y="248" font-size="11.5" fill="#52606d">system (fibre). Dividing by the MAXIMUM is what guarantees</text>
  <text x="614" y="264" font-size="11.5" fill="#52606d">the estimate can never exceed the real cost.</text>
  <rect x="596" y="288" width="484" height="164" rx="10" fill="#e8f2f8" stroke="#0072B2" stroke-width="1.6"/>
  <text x="614" y="312" font-size="13.5" fill="#0b5c8a" font-weight="700">WHY IT IS ADMISSIBLE</text>
  <text x="614" y="334" font-size="11.5" fill="#1f2933">overhead &gt;= 0,  quality &lt;= 1,  speed(type) &lt;= MAX_SPEED</text>
  <text x="614" y="356" font-size="12" fill="#1f2933" font-family="Consolas, SFMono-Regular, Menlo, monospace">=&gt; cost(u,v) &gt;= d(u,v) / MAX_SPEED</text>
  <text x="614" y="378" font-size="11.5" fill="#52606d">Summing along the path and applying the triangle</text>
  <text x="614" y="394" font-size="11.5" fill="#52606d">inequality, distance travelled &gt;= the straight line.</text>
  <text x="614" y="416" font-size="12" fill="#1f2933" font-family="Consolas, SFMono-Regular, Menlo, monospace">=&gt; optimal_cost(n) &gt;= h(n)    admissible</text>
  <text x="614" y="440" font-size="12" fill="#1f2933" font-family="Consolas, SFMono-Regular, Menlo, monospace">h(u) &lt;= cost(u,v) + h(v)      consistent</text>
  <rect x="596" y="464" width="484" height="58" rx="8" fill="#e6f5f0" stroke="#009E73" stroke-width="1.0"/>
  <text x="614" y="486" font-size="12.5" fill="#046c50" font-weight="700">VERIFIED, NOT MERELY ARGUED</text>
  <text x="614" y="506" font-size="11.5" fill="#046c50">Every ordered pair, against Floyd-Warshall, which honours the same customer-edge rule.</text>
  <text x="40" y="558" font-size="15" fill="#1f2933" font-weight="700">Five strategies on one problem - three lessons</text>
  <rect x="40" y="572" width="1040" height="128" rx="8" fill="#ffffff" stroke="#c9c2b8" stroke-width="1.0"/>
  <line x1="40" y1="600" x2="1080" y2="600" stroke="#c9c2b8" stroke-width="1"/>
  <text x="60" y="592" font-size="12" fill="#52606d" font-weight="700">strategy</text>
  <text x="300" y="592" font-size="12" fill="#52606d" font-weight="700">steps</text>
  <text x="400" y="592" font-size="12" fill="#52606d" font-weight="700">cost (ms)</text>
  <text x="530" y="592" font-size="12" fill="#52606d" font-weight="700">nodes expanded</text>
  <text x="700" y="592" font-size="12" fill="#52606d" font-weight="700">optimal?</text>
  <text x="820" y="592" font-size="12" fill="#52606d" font-weight="700">lesson</text>
  <text x="60" y="620" font-size="12" fill="#1f2933">Breadth-first</text>
  <text x="300" y="620" font-size="12" fill="#1f2933">4</text>
  <text x="400" y="620" font-size="12" fill="#1f2933">453.51</text>
  <text x="530" y="620" font-size="12" fill="#1f2933">15</text>
  <text x="700" y="620" font-size="12" fill="#a8442a">steps only</text>
  <text x="820" y="620" font-size="11" fill="#52606d">fewest hops, over the slow medium</text>
  <text x="60" y="640" font-size="12" fill="#1f2933">Depth-first</text>
  <text x="300" y="640" font-size="12" fill="#1f2933">4</text>
  <text x="400" y="640" font-size="12" fill="#1f2933">453.51</text>
  <text x="530" y="640" font-size="12" fill="#1f2933" font-weight="700">7</text>
  <text x="700" y="640" font-size="12" fill="#a8442a">no</text>
  <text x="820" y="640" font-size="11" fill="#52606d">no guarantee at all</text>
  <text x="60" y="660" font-size="12" fill="#1f2933">Uniform cost</text>
  <text x="300" y="660" font-size="12" fill="#1f2933">5</text>
  <text x="400" y="660" font-size="12" fill="#1f2933" font-weight="700">360.35</text>
  <text x="530" y="660" font-size="12" fill="#1f2933">28</text>
  <text x="700" y="660" font-size="12" fill="#046c50" font-weight="700">yes</text>
  <text x="820" y="660" font-size="11" fill="#52606d">optimal, but blind</text>
  <text x="60" y="680" font-size="12" fill="#1f2933">Greedy</text>
  <text x="300" y="680" font-size="12" fill="#1f2933">5</text>
  <text x="400" y="680" font-size="12" fill="#1f2933" font-weight="700">360.35</text>
  <text x="530" y="680" font-size="12" fill="#1f2933" font-weight="700">7</text>
  <text x="700" y="680" font-size="12" fill="#a8442a">no</text>
  <text x="820" y="680" font-size="11" fill="#52606d">right here, by luck</text>
  <text x="60" y="716" font-size="12.5" fill="#8a6100" font-weight="700">A*</text>
  <text x="300" y="716" font-size="12.5" fill="#8a6100" font-weight="700">5</text>
  <text x="400" y="716" font-size="12.5" fill="#8a6100" font-weight="700">360.35</text>
  <text x="530" y="716" font-size="12.5" fill="#8a6100" font-weight="700">23</text>
  <text x="700" y="716" font-size="12.5" fill="#046c50" font-weight="700">yes</text>
  <text x="820" y="716" font-size="11.5" fill="#8a6100" font-weight="700">same optimum, less work</text>
  <rect x="40" y="726" width="1040" height="28" rx="6" fill="#fdf1dc" stroke="#E69F00" stroke-width="1.0"/>
  <text x="60" y="745" font-size="11.5" fill="#8a6100">Summed over every ORDERED pair, A* expands 25.9% fewer nodes than uniform cost at 30 nodes but only 8.9% fewer at 60: the advantage SHRANK as the graph grew.</text>
</svg>
