[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aisg"
version = "0.9.0"
description = "Expert system, automated planning (STRIPS/GPS) and A* search applied to smart-grid communication networks"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Fernando Sabino Dantas" }]
keywords = ["artificial-intelligence", "expert-system", "strips", "planning", "a-star", "smart-grid"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]
notebook = ["matplotlib>=3.7", "ipykernel>=6"]

[project.scripts]
aisg = "aisg.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aisg = ["domain/data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
