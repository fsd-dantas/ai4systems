name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check the tag matches the package version
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match package version ${version}"
            exit 1
          fi
          echo "VERSION=${version}" >> "$GITHUB_ENV"

      - name: Test
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pytest -q

      - name: Build the wheel and source archive
        run: |
          python -m pip install build
          python -m build

      - name: Bundle the ns-3 program, patch and scenarios
        run: |
          bundle="aisg-ns3-bundle-${VERSION}"
          mkdir -p "${bundle}/scenarios"
          cp -r software/ns-3-modules/. "${bundle}/"
          cp experiments/004-multi-rat-simulation/configuration/*.scn "${bundle}/scenarios/"
          cp experiments/004-multi-rat-simulation/README.md "${bundle}/EXPERIMENT.md"
          cp LICENSE "${bundle}/"
          zip -r "dist/${bundle}.zip" "${bundle}"

      - name: Release notes from the changelog
        run: |
          python - <<'EOF'
          import os
          import re

          version = os.environ["VERSION"]
          text = open("CHANGELOG.md", encoding="utf-8").read()
          pattern = rf"^## \[{re.escape(version)}\][^\n]*\n(.*?)(?=^## \[|\Z)"
          match = re.search(pattern, text, flags=re.M | re.S)
          if not match or not match.group(1).strip():
              raise SystemExit(f"CHANGELOG.md has no notes for {version}")
          with open("release-notes.md", "w", encoding="utf-8") as notes:
              notes.write(match.group(1).strip() + "\n")
          EOF

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "aisg ${VERSION}" \
            --notes-file release-notes.md
