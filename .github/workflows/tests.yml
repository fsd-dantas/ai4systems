name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  software:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The core depends only on the standard library, so it is worth proving
        # that across every Python the package claims to support.
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the package and its test extra
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run the test suite
        run: python -m pytest -q

      - name: Check the command-line interface starts
        run: |
          aisg --version
          aisg --lang en diagnose --case rf_interference
          aisg --lang en route --compare
          aisg --lang en pipeline --case congestion
          aisg --lang en blackboard --scenario dual-outage
          aisg --lang en eco --problem blocks
          aisg --lang en eco --problem network --scenario saf-chain-outage
