<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 760" width="1120" height="760" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Busca A*: f = g + h, admissibilidade e comparacao entre estrategias</title>
  <desc>A esquerda, o caminho otimo encontrado pelo A* no cenario base. A direita, a decomposicao f = g + h, a prova de admissibilidade e a tabela comparativa das cinco estrategias.</desc>

  <defs>
    <marker id="s-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#D55E00"/>
    </marker>
  </defs>

  <rect width="1120" height="760" fill="#fbfaf7"/>

  <text x="40" y="46" font-size="23" font-weight="600" fill="#1f2933">Busca A* — f(n) = g(n) + h(n)</text>
  <text x="40" y="72" font-size="14" fill="#52606d">g e o custo ja pago; h e a estimativa do que falta. So g da o custo uniforme (otimo, cego). So h da a gulosa (rapida, sem garantia).</text>

  <!-- ============ left: the graph ============ -->
  <text x="40" y="112" font-size="15" font-weight="700" fill="#1f2933">Caminho otimo no cenario base: NOC → RECLOSER_7</text>

  <rect x="40" y="126" width="530" height="396" rx="10" fill="#ffffff" stroke="#c9c2b8"/>

  <!-- non-optimal branch: radio + SAF chain -->
  <line x1="112" y1="188" x2="238" y2="168" stroke="#9a8c78" stroke-width="2" stroke-dasharray="3 3"/>
  <line x1="238" y1="168" x2="336" y2="206" stroke="#9a8c78" stroke-width="2" stroke-dasharray="3 3"/>
  <line x1="336" y1="206" x2="398" y2="282" stroke="#d4a373" stroke-width="2.6" stroke-dasharray="2 3"/>
  <line x1="398" y1="282" x2="452" y2="352" stroke="#d4a373" stroke-width="2.6" stroke-dasharray="2 3"/>
  <line x1="452" y1="352" x2="504" y2="292" stroke="#9a8c78" stroke-width="2" stroke-dasharray="3 3"/>

  <!-- optimal path -->
  <polyline points="112,188 170,262 296,326 448,388 504,292" fill="none" stroke="#D55E00" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" opacity="0.85"/>

  <!-- nodes -->
  <g font-size="11" fill="#1f2933">
    <rect x="100" y="176" width="24" height="24" rx="4" fill="#1b3a6b"/>
    <text x="70" y="172" font-weight="700">NOC</text>

    <circle cx="170" cy="262" r="10" fill="#3f7cac"/>
    <text x="96" y="266" font-size="10.5">LTE_CORE</text>

    <polygon points="296,316 306,334 286,334" fill="#3f7cac"/>
    <text x="228" y="332" font-size="10.5">LTE_ENB</text>

    <circle cx="448" cy="388" r="10" fill="#6b8f71"/>
    <text x="464" y="404" font-size="10.5">RM_A5</text>

    <polygon points="504,278 512,292 504,306 496,292" fill="#b23a48"/>
    <text x="470" y="268" font-size="10.5" font-weight="700">RECLOSER_7</text>

    <polygon points="238,158 248,176 228,176" fill="#c1666b"/>
    <text x="214" y="152" font-size="10.5">AP_A</text>

    <circle cx="336" cy="206" r="9" fill="#6b8f71"/>
    <text x="322" y="196" font-size="10.5">RM_A3</text>

    <rect x="390" y="274" width="16" height="16" rx="3" fill="#d4a373" transform="rotate(45 398 282)"/>
    <text x="336" y="272" font-size="10.5">SAF_A1</text>

    <rect x="444" y="344" width="16" height="16" rx="3" fill="#d4a373" transform="rotate(45 452 352)"/>
    <text x="392" y="344" font-size="10.5">SAF_A2</text>
  </g>

  <!-- hop costs on optimal path -->
  <g font-size="10.5" fill="#a8442a" font-weight="600">
    <text x="118" y="232">5,99</text>
    <text x="212" y="304">10,55</text>
    <text x="356" y="372">69,94</text>
    <text x="494" y="344">5,74</text>
  </g>

  <rect x="58" y="428" width="494" height="76" rx="6" fill="#fdecea" stroke="#e0a49c"/>
  <text x="72" y="450" font-size="12" font-weight="700" fill="#a8442a">NOC → LTE_CORE → LTE_ENB → RM_A5 → RECLOSER_7</text>
  <text x="72" y="470" font-size="13" font-weight="700" fill="#a8442a">custo total = 92,22 ms</text>
  <text x="72" y="492" font-size="11" fill="#a8442a">o caminho otimo evita inteiramente a cadeia armazena-e-encaminha (tracejada)</text>

  <!-- ============ right: f = g + h ============ -->
  <rect x="596" y="126" width="484" height="150" rx="10" fill="#ffffff" stroke="#E69F00" stroke-width="2"/>
  <text x="614" y="150" font-size="14" font-weight="700" fill="#8a6100">A HEURISTICA</text>
  <text x="614" y="180" font-size="13" fill="#1f2933" font-family="Consolas, monospace">h(n) =</text>
  <text x="676" y="174" font-size="12.5" fill="#1f2933" font-family="Consolas, monospace">distancia_linha_reta(n, objetivo)</text>
  <line x1="672" y1="182" x2="944" y2="182" stroke="#1f2933" stroke-width="1.2"/>
  <text x="742" y="200" font-size="12.5" fill="#1f2933" font-family="Consolas, monospace">VELOCIDADE_MAXIMA</text>
  <text x="614" y="238" font-size="11.5" fill="#52606d">VELOCIDADE_MAXIMA = 150 m/ms — a maior velocidade efetiva</text>
  <text x="614" y="254" font-size="11.5" fill="#52606d">do sistema (a fibra). Dividir pelo MAXIMO e o que garante</text>
  <text x="614" y="270" font-size="11.5" fill="#52606d">que a estimativa nunca ultrapasse o custo real.</text>

  <!-- proof -->
  <rect x="596" y="288" width="484" height="164" rx="10" fill="#e8f2f8" stroke="#0072B2" stroke-width="1.6"/>
  <text x="614" y="312" font-size="13.5" font-weight="700" fill="#0b5c8a">POR QUE E ADMISSIVEL</text>
  <text x="614" y="334" font-size="11.5" fill="#1f2933">sobrecarga ≥ 0,  qualidade ≤ 1,  velocidade(tipo) ≤ MAXIMA</text>
  <text x="614" y="356" font-size="12" fill="#1f2933" font-family="Consolas, monospace">⇒ custo(u,v) ≥ d(u,v) / MAXIMA</text>
  <text x="614" y="378" font-size="11.5" fill="#52606d">Somando ao longo do caminho e aplicando a desigualdade</text>
  <text x="614" y="394" font-size="11.5" fill="#52606d">triangular, a distancia percorrida ≥ a linha reta.</text>
  <text x="614" y="416" font-size="12" fill="#1f2933" font-family="Consolas, monospace">⇒ custo_otimo(n) ≥ h(n)   ∎  admissivel</text>
  <text x="614" y="440" font-size="12" fill="#1f2933" font-family="Consolas, monospace">h(u) ≤ custo(u,v) + h(v)  ∎  consistente</text>

  <!-- verification -->
  <rect x="596" y="464" width="484" height="58" rx="8" fill="#e6f5f0" stroke="#009E73"/>
  <text x="614" y="486" font-size="12.5" font-weight="700" fill="#046c50">VERIFICADO, NAO APENAS ARGUMENTADO</text>
  <text x="614" y="506" font-size="11.5" fill="#046c50">Testes conferem as duas propriedades em TODOS os pares origem-objetivo</text>

  <!-- ============ comparison table ============ -->
  <text x="40" y="558" font-size="15" font-weight="700" fill="#1f2933">Cinco estrategias sobre o mesmo problema — tres licoes</text>

  <rect x="40" y="572" width="1040" height="128" rx="8" fill="#ffffff" stroke="#c9c2b8"/>
  <line x1="40" y1="600" x2="1080" y2="600" stroke="#c9c2b8"/>
  <g font-size="12" fill="#52606d" font-weight="700">
    <text x="60" y="592">estrategia</text>
    <text x="300" y="592">passos</text>
    <text x="400" y="592">custo (ms)</text>
    <text x="530" y="592">nos expandidos</text>
    <text x="700" y="592">otimo?</text>
    <text x="820" y="592">licao</text>
  </g>
  <g font-size="12" fill="#1f2933">
    <text x="60" y="620">Largura (BFS)</text>
    <text x="300" y="620">4</text>
    <text x="400" y="620">357,35</text>
    <text x="530" y="620">15</text>
    <text x="700" y="620" fill="#a8442a">so em passos</text>
    <text x="820" y="620" font-size="11" fill="#52606d">conta fibra e SAF como iguais</text>

    <text x="60" y="640">Profundidade (DFS)</text>
    <text x="300" y="640">5</text>
    <text x="400" y="640">343,06</text>
    <text x="530" y="640">19</text>
    <text x="700" y="640" fill="#a8442a">nao</text>
    <text x="820" y="640" font-size="11" fill="#52606d">sem garantia alguma</text>

    <text x="60" y="660">Custo uniforme</text>
    <text x="300" y="660">4</text>
    <text x="400" y="660" font-weight="700">92,22</text>
    <text x="530" y="660">13</text>
    <text x="700" y="660" fill="#046c50" font-weight="700">sim</text>
    <text x="820" y="660" font-size="11" fill="#52606d">otimo, porem cego</text>

    <text x="60" y="680">Gulosa</text>
    <text x="300" y="680">4</text>
    <text x="400" y="680">357,35</text>
    <text x="530" y="680" font-weight="700">5</text>
    <text x="700" y="680" fill="#a8442a">nao</text>
    <text x="820" y="680" font-size="11" fill="#a8442a" font-weight="600">a mais rapida — e errada</text>
  </g>
  <rect x="44" y="686" width="1032" height="0.5" fill="#c9c2b8"/>

  <rect x="44" y="688" width="1032" height="0" fill="none"/>
  <g font-size="12.5" font-weight="700" fill="#8a6100">
    <text x="60" y="716">A*</text>
    <text x="300" y="716">4</text>
    <text x="400" y="716">92,22</text>
    <text x="530" y="716">11</text>
    <text x="700" y="716" fill="#046c50">sim</text>
    <text x="820" y="716" font-size="11.5">mesmo otimo, menos trabalho</text>
  </g>

  <rect x="40" y="726" width="1040" height="28" rx="6" fill="#fdf1dc" stroke="#e2c281"/>
  <text x="60" y="745" font-size="11.5" fill="#8a6100">A vantagem da heuristica CRESCE com o grafo: no cenario de 30 nos, A* expande 14 nos contra 25 do custo uniforme — 44% menos trabalho para a mesma resposta otima.</text>
</svg>
