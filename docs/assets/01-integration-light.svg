<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 640" width="1180" height="640" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Integration of the three systems</title>
  <desc>The expert system produces a diagnosis that becomes the planner's initial state; the planner asks A* whether an alternative route exists; and the progression planner reuses the same A* function that solves routing.</desc>
  <rect width="1180" height="640" fill="#fbfaf7"/>
  <text x="40" y="46" font-size="23" fill="#1f2933" font-weight="600">How the three systems connect</text>
  <text x="40" y="72" font-size="14" fill="#52606d">One incident crosses all three. The arrows show what each system hands to the next.</text>
  <rect x="40" y="108" width="260" height="62" rx="8" fill="#eef1f4" stroke="#c3ccd5" stroke-width="1.0"/>
  <text x="170" y="134" font-size="14" fill="#1f2933" font-weight="600" text-anchor="middle">telemetry</text>
  <text x="170" y="154" font-size="12" fill="#52606d" font-weight="middle">RSSI, SNR, loss, RTT</text>
  <line x1="170" y1="172" x2="170.0" y2="193.0" stroke="#52606d" stroke-width="2.0"/>
  <polygon points="170,204 164.5,193.0 175.5,193.0" fill="#52606d"/>
  <rect x="40" y="208" width="320" height="180" rx="10" fill="#ffffff" stroke="#0072B2" stroke-width="2"/>
  <path d="M 50 208 H 350 A 10 10 0 0 1 360 218 V 244 H 40 V 218 A 10 10 0 0 1 50 208 Z" fill="#0072B2"/>
  <text x="58" y="233" font-size="15" fill="#ffffff" font-weight="700">1 - EXPERT SYSTEM</text>
  <text x="58" y="270" font-size="13" fill="#1f2933">43 production rules, 5 layers</text>
  <text x="58" y="290" font-size="13" fill="#52606d">forward and backward chaining</text>
  <text x="58" y="310" font-size="13" fill="#52606d">certainty factors (MYCIN)</text>
  <text x="58" y="330" font-size="13" fill="#52606d">explanation: why / how</text>
  <rect x="58" y="344" width="284" height="32" rx="6" fill="#e8f2f8" stroke="#0072B2" stroke-width="1.0"/>
  <text x="200.0" y="365" font-size="12.5" fill="#0b5c8a" font-weight="600" text-anchor="middle">diagnosis + action + authorisation</text>
  <rect x="440" y="208" width="320" height="180" rx="10" fill="#ffffff" stroke="#009E73" stroke-width="2"/>
  <path d="M 450 208 H 750 A 10 10 0 0 1 760 218 V 244 H 440 V 218 A 10 10 0 0 1 450 208 Z" fill="#009E73"/>
  <text x="458" y="233" font-size="15" fill="#ffffff" font-weight="700">2 - STRIPS / GPS PLANNER</text>
  <text x="458" y="270" font-size="13" fill="#1f2933">12 STRIPS operators</text>
  <text x="458" y="290" font-size="13" fill="#52606d">GPS: means-ends analysis</text>
  <text x="458" y="310" font-size="13" fill="#52606d">A* progression planner</text>
  <text x="458" y="330" font-size="13" fill="#52606d">plan validation</text>
  <rect x="458" y="344" width="284" height="32" rx="6" fill="#e6f5f0" stroke="#009E73" stroke-width="1.0"/>
  <text x="600.0" y="365" font-size="12.5" fill="#046c50" font-weight="600" text-anchor="middle">ordered, validated plan</text>
  <rect x="840" y="208" width="300" height="180" rx="10" fill="#ffffff" stroke="#E69F00" stroke-width="2"/>
  <path d="M 850 208 H 1130 A 10 10 0 0 1 1140 218 V 244 H 840 V 218 A 10 10 0 0 1 850 208 Z" fill="#E69F00"/>
  <text x="858" y="233" font-size="15" fill="#ffffff" font-weight="700">3 - A* SEARCH</text>
  <text x="858" y="270" font-size="13" fill="#1f2933">f(n) = g(n) + h(n)</text>
  <text x="858" y="290" font-size="13" fill="#52606d">admissible, consistent heuristic</text>
  <text x="858" y="310" font-size="13" fill="#52606d">breadth-first, depth-first, uniform cost</text>
  <text x="858" y="330" font-size="13" fill="#52606d">greedy - for comparison</text>
  <rect x="858" y="344" width="264" height="32" rx="6" fill="#fdf1dc" stroke="#E69F00" stroke-width="1.0"/>
  <text x="990.0" y="365" font-size="12.5" fill="#8a6100" font-weight="600" text-anchor="middle">exact path + optimal cost</text>
  <line x1="364" y1="298" x2="425.0" y2="298.0" stroke="#52606d" stroke-width="2.4"/>
  <polygon points="436,298 425.0,303.5 425.0,292.5" fill="#52606d"/>
  <text x="400" y="284" font-size="12" fill="#1f2933" font-weight="600" text-anchor="middle">diagnosis</text>
  <text x="400" y="318" font-size="11" fill="#52606d" font-weight="middle">becomes the</text>
  <text x="400" y="331" font-size="11" fill="#52606d" font-weight="middle">initial state</text>
  <line x1="764" y1="282" x2="825.0" y2="282.0" stroke="#D55E00" stroke-width="2.4"/>
  <polygon points="836,282 825.0,287.5 825.0,276.5" fill="#D55E00"/>
  <text x="800" y="258" font-size="11.5" fill="#D55E00" font-weight="600" text-anchor="middle">alternative</text>
  <text x="800" y="271" font-size="11.5" fill="#D55E00" font-weight="600" text-anchor="middle">route?</text>
  <line x1="836" y1="326" x2="775.0" y2="326.0" stroke="#D55E00" stroke-width="2.4"/>
  <polygon points="764,326 775.0,320.5 775.0,331.5" fill="#D55E00"/>
  <text x="800" y="346" font-size="11.5" fill="#D55E00" font-weight="600" text-anchor="middle">yes / no</text>
  <path d="M 600 392 L 600 428 L 990 428 L 990 392" stroke="#8c6db5" stroke-width="2" stroke-dasharray="6 4" fill="none"/>
  <rect x="636" y="412" width="318" height="32" rx="6" fill="#f3eefa" stroke="#8c6db5" stroke-width="1.0"/>
  <text x="795" y="433" font-size="12.5" fill="#5b3f86" font-weight="600" text-anchor="middle">the SAME astar() function, not a copy</text>
  <rect x="40" y="474" width="1100" height="80" rx="10" fill="#ffffff" stroke="#b6b0a6" stroke-width="1.6"/>
  <text x="60" y="500" font-size="14" fill="#1f2933" font-weight="700">SHARED DOMAIN - synthetic communication backhaul</text>
  <text x="60" y="522" font-size="12.5" fill="#52606d">17 nodes (base scenario) or 30 nodes (scale scenario) - fibre core - 900 MHz radio sectors - store-and-forward chain - private LTE overlay</text>
  <text x="60" y="541" font-size="12.5" fill="#52606d">link cost = overhead(type) + distance / (speed(type) x quality)     -     distances derived from the coordinates</text>
  <line x1="200" y1="470" x2="200" y2="390" stroke="#b6b0a6" stroke-width="1.4" stroke-dasharray="4 4"/>
  <line x1="600" y1="470" x2="600" y2="446" stroke="#b6b0a6" stroke-width="1.4" stroke-dasharray="4 4"/>
  <line x1="990" y1="470" x2="990" y2="446" stroke="#b6b0a6" stroke-width="1.4" stroke-dasharray="4 4"/>
  <rect x="40" y="572" width="1100" height="46" rx="8" fill="#fdecea" stroke="#D55E00" stroke-width="1.0"/>
  <text x="60" y="592" font-size="12.5" fill="#a8442a" font-weight="700">VALIDITY LIMIT</text>
  <text x="60" y="609" font-size="12" fill="#a8442a">Synthetic topology. Nominal, uncalibrated thresholds. No labelled fault dataset exists for this domain. The system RECOMMENDS, it does not act.</text>
</svg>
