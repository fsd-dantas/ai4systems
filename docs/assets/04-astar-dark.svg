<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 770" width="1120" height="770" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>A* search: f = g + h, admissibility, and strategy comparison</title>
  <desc>On the left, the cheapest route A* finds in the simulated scenario. On the right, the heuristic, its admissibility and consistency proofs, and the comparison table for five search strategies.</desc>
  <rect width="1120" height="770" fill="#0d1117"/>
  <text x="40" y="46" font-size="23" fill="#e6edf3" font-weight="600">A* search - f(n) = g(n) + h(n)</text>
  <text x="40" y="72" font-size="14" fill="#9daab7">g is the cost already paid; h estimates what remains. g alone is uniform cost (optimal, blind). h alone is greedy (fast, no guarantee).</text>
  <text x="40" y="112" font-size="15" fill="#e6edf3" font-weight="700">Optimal path in the simulated scenario: LTE_ENB to AP_B</text>
  <rect x="40" y="126" width="530" height="396" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.0"/>
  <line x1="120" y1="210" x2="300" y2="160" stroke="#6b7280" stroke-width="2.4" stroke-dasharray="4 4"/>
  <line x1="300" y1="160" x2="500" y2="210" stroke="#6b7280" stroke-width="2.4" stroke-dasharray="4 4"/>
  <polyline points="120,210 220,320 380,360 500,210" fill="none" stroke="#f2794a" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" opacity="0.9"/>
  <polygon points="120,196 130,214 110,214" fill="#58a6ff"/>
  <text x="56" y="190" font-size="11" fill="#e6edf3" font-weight="700">LTE_ENB</text>
  <circle cx="220" cy="320" r="10" fill="#58a6ff"/>
  <text x="150" y="326" font-size="10.5" fill="#e6edf3">LTE_CORE</text>
  <rect x="368" y="348" width="24" height="24" rx="4" fill="#7aa2d6"/>
  <text x="400" y="368" font-size="10.5" fill="#e6edf3">NOC</text>
  <polygon points="500,196 510,214 490,214" fill="#e8908f"/>
  <text x="514" y="206" font-size="11" fill="#e6edf3" font-weight="700">AP_B</text>
  <circle cx="300" cy="160" r="9" fill="#7fc99a"/>
  <text x="280" y="142" font-size="10.5" fill="#e6edf3">RM_B4</text>
  <text x="116" y="274" font-size="10.5" fill="#ffa07a" font-weight="600">13.86</text>
  <text x="288" y="386" font-size="10.5" fill="#ffa07a" font-weight="600">9.41</text>
  <text x="452" y="292" font-size="10.5" fill="#ffa07a" font-weight="600">47.23</text>
  <text x="172" y="176" font-size="10.5" fill="#9daab7" font-weight="600">263.15</text>
  <text x="382" y="176" font-size="10.5" fill="#9daab7" font-weight="600">118.31</text>
  <rect x="58" y="400" width="494" height="108" rx="6" fill="#33190f" stroke="#f2794a" stroke-width="1.0"/>
  <text x="72" y="424" font-size="11.5" fill="#ffa07a" font-weight="700">A*:  LTE_ENB -&gt; LTE_CORE -&gt; NOC -&gt; AP_B</text>
  <text x="72" y="446" font-size="13" fill="#ffa07a" font-weight="700">3 hops,  total cost = 70.51 ms</text>
  <text x="72" y="474" font-size="11" fill="#9daab7">breadth-first (dashed):  LTE_ENB -&gt; RM_B4 -&gt; AP_B</text>
  <text x="72" y="494" font-size="11" fill="#ffa07a" font-weight="600">2 hops, 381.46 ms - fewer hops, five times the cost</text>
  <rect x="596" y="126" width="484" height="150" rx="10" fill="#161b22" stroke="#e3b341" stroke-width="2"/>
  <text x="614" y="150" font-size="14" fill="#f0cc72" font-weight="700">THE HEURISTIC</text>
  <text x="614" y="180" font-size="13" fill="#e6edf3" font-family="Consolas, SFMono-Regular, Menlo, monospace">h(n) =</text>
  <text x="676" y="174" font-size="12.5" fill="#e6edf3" font-family="Consolas, SFMono-Regular, Menlo, monospace">straight_line_distance(n, goal)</text>
  <line x1="672" y1="182" x2="936" y2="182" stroke="#e6edf3" stroke-width="1.2"/>
  <text x="742" y="200" font-size="12.5" fill="#e6edf3" font-family="Consolas, SFMono-Regular, Menlo, monospace">MAX_SPEED</text>
  <text x="614" y="232" font-size="11.5" fill="#9daab7">MAX_SPEED = 150 m/ms - the fastest effective speed in the</text>
  <text x="614" y="248" font-size="11.5" fill="#9daab7">system (fibre). Dividing by the MAXIMUM is what guarantees</text>
  <text x="614" y="264" font-size="11.5" fill="#9daab7">the estimate can never exceed the real cost.</text>
  <rect x="596" y="288" width="484" height="164" rx="10" fill="#122238" stroke="#58a6ff" stroke-width="1.6"/>
  <text x="614" y="312" font-size="13.5" fill="#8cc8ff" font-weight="700">WHY IT IS ADMISSIBLE</text>
  <text x="614" y="334" font-size="11.5" fill="#e6edf3">overhead &gt;= 0,  quality &lt;= 1,  speed(type) &lt;= MAX_SPEED</text>
  <text x="614" y="356" font-size="12" fill="#e6edf3" font-family="Consolas, SFMono-Regular, Menlo, monospace">=&gt; cost(u,v) &gt;= d(u,v) / MAX_SPEED</text>
  <text x="614" y="378" font-size="11.5" fill="#9daab7">Summing along the path and applying the triangle</text>
  <text x="614" y="394" font-size="11.5" fill="#9daab7">inequality, distance travelled &gt;= the straight line.</text>
  <text x="614" y="416" font-size="12" fill="#e6edf3" font-family="Consolas, SFMono-Regular, Menlo, monospace">=&gt; optimal_cost(n) &gt;= h(n)    admissible</text>
  <text x="614" y="440" font-size="12" fill="#e6edf3" font-family="Consolas, SFMono-Regular, Menlo, monospace">h(u) &lt;= cost(u,v) + h(v)      consistent</text>
  <rect x="596" y="464" width="484" height="58" rx="8" fill="#0f2a22" stroke="#4ec9a0" stroke-width="1.0"/>
  <text x="614" y="486" font-size="12.5" fill="#7fe0c0" font-weight="700">VERIFIED, NOT MERELY ARGUED</text>
  <text x="614" y="506" font-size="11.5" fill="#7fe0c0">Checked over every ordered pair, in both scenarios, against Floyd-Warshall.</text>
  <text x="40" y="558" font-size="15" fill="#e6edf3" font-weight="700">Five strategies on one problem - three lessons</text>
  <rect x="40" y="572" width="1040" height="128" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.0"/>
  <line x1="40" y1="600" x2="1080" y2="600" stroke="#30363d" stroke-width="1"/>
  <text x="60" y="592" font-size="12" fill="#9daab7" font-weight="700">strategy</text>
  <text x="300" y="592" font-size="12" fill="#9daab7" font-weight="700">steps</text>
  <text x="400" y="592" font-size="12" fill="#9daab7" font-weight="700">cost (ms)</text>
  <text x="530" y="592" font-size="12" fill="#9daab7" font-weight="700">nodes expanded</text>
  <text x="700" y="592" font-size="12" fill="#9daab7" font-weight="700">optimal?</text>
  <text x="820" y="592" font-size="12" fill="#9daab7" font-weight="700">lesson</text>
  <text x="60" y="620" font-size="12" fill="#e6edf3">Breadth-first</text>
  <text x="300" y="620" font-size="12" fill="#e6edf3">2</text>
  <text x="400" y="620" font-size="12" fill="#e6edf3">381.46</text>
  <text x="530" y="620" font-size="12" fill="#e6edf3">7</text>
  <text x="700" y="620" font-size="12" fill="#ffa07a">steps only</text>
  <text x="820" y="620" font-size="11" fill="#9daab7">fewest hops - and five times the cost</text>
  <text x="60" y="640" font-size="12" fill="#e6edf3">Depth-first</text>
  <text x="300" y="640" font-size="12" fill="#e6edf3">6</text>
  <text x="400" y="640" font-size="12" fill="#e6edf3">694.78</text>
  <text x="530" y="640" font-size="12" fill="#e6edf3">7</text>
  <text x="700" y="640" font-size="12" fill="#ffa07a">no</text>
  <text x="820" y="640" font-size="11" fill="#9daab7">no guarantee at all</text>
  <text x="60" y="660" font-size="12" fill="#e6edf3">Uniform cost</text>
  <text x="300" y="660" font-size="12" fill="#e6edf3">3</text>
  <text x="400" y="660" font-size="12" fill="#e6edf3" font-weight="700">70.51</text>
  <text x="530" y="660" font-size="12" fill="#e6edf3">6</text>
  <text x="700" y="660" font-size="12" fill="#7fe0c0" font-weight="700">yes</text>
  <text x="820" y="660" font-size="11" fill="#9daab7">optimal, but blind</text>
  <text x="60" y="680" font-size="12" fill="#e6edf3">Greedy</text>
  <text x="300" y="680" font-size="12" fill="#e6edf3">2</text>
  <text x="400" y="680" font-size="12" fill="#e6edf3">381.46</text>
  <text x="530" y="680" font-size="12" fill="#e6edf3" font-weight="700">3</text>
  <text x="700" y="680" font-size="12" fill="#ffa07a">no</text>
  <text x="820" y="680" font-size="11" fill="#ffa07a">the fastest - and wrong</text>
  <text x="60" y="716" font-size="12.5" fill="#f0cc72" font-weight="700">A*</text>
  <text x="300" y="716" font-size="12.5" fill="#f0cc72" font-weight="700">3</text>
  <text x="400" y="716" font-size="12.5" fill="#f0cc72" font-weight="700">70.51</text>
  <text x="530" y="716" font-size="12.5" fill="#f0cc72" font-weight="700">4</text>
  <text x="700" y="716" font-size="12.5" fill="#7fe0c0" font-weight="700">yes</text>
  <text x="820" y="716" font-size="11.5" fill="#f0cc72" font-weight="700">same optimum, less work</text>
  <rect x="40" y="726" width="1040" height="28" rx="6" fill="#2e2410" stroke="#e3b341" stroke-width="1.0"/>
  <text x="60" y="745" font-size="11.5" fill="#f0cc72">Summed over every ORDERED node pair, A* expands 9.4% fewer nodes than uniform cost at 17 nodes and 25.9% fewer at 30 - a larger saving here, not a scaling law.</text>
</svg>
